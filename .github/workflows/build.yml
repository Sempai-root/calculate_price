name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: Windows
            icon: icon.ico

          - os: macos-latest
            name: macOS
            artifact_name: macOS
            icon: icon.icns

          - os: ubuntu-latest
            name: Linux
            artifact_name: Linux
            icon: icon.png

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pyperclip

      - name: Build with PyInstaller
        shell: bash
        run: |
          echo "Building for ${{ matrix.name }}..."

          ICON_FLAG=""
          if [ -f "${{ matrix.icon }}" ]; then
            ICON_FLAG="--icon ${{ matrix.icon }}"
            echo "Using icon: ${{ matrix.icon }}"
          else
            echo "Icon ${{ matrix.icon }} not found, building without icon."
          fi

          if [ "${{ matrix.name }}" = "macOS" ]; then
            # Для macOS собираем как .app (лучше, чем onefile)
            pyinstaller --windowed \
                        --name "Калькулятор_билетов" \
                        $ICON_FLAG \
                        --add-data "icon.png:." \
                        --onedir \
                        main.py
          else
            pyinstaller --onefile \
                        --windowed \
                        --name "Калькулятор_билетов" \
                        $ICON_FLAG \
                        main.py
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Калькулятор_билетов-${{ matrix.artifact_name }}
          path: |
            dist/*
          retention-days: 30