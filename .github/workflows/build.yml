name: Build Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # ← Важно! Чтобы Windows и Linux собирались даже если macOS упал
      matrix:
        include:
          - os: windows-latest
            name: Windows
            artifact_name: Windows
            icon: icon.ico
            onefile: true

          - os: macos-latest
            name: macOS
            artifact_name: macOS
            icon: icon.icns
            onefile: false

          - os: ubuntu-latest
            name: Linux
            artifact_name: Linux
            icon: icon.png
            onefile: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pyperclip

      - name: Build with PyInstaller
        run: |
          echo "Building for ${{ matrix.name }}..."

          if [ "${{ matrix.name }}" = "macOS" ]; then
            # Для macOS лучше собирать как .app (onedir)
            pyinstaller --windowed \
                        --name "Калькулятор_билетов" \
                        --icon "${{ matrix.icon }}" \
                        --add-data "icon.png:." \
                        --onedir \
                        main.py
          else
            pyinstaller --onefile \
                        --windowed \
                        --name "Калькулятор_билетов" \
                        --icon "${{ matrix.icon }}" \
                        main.py
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Калькулятор_билетов-${{ matrix.artifact_name }}
          path: |
            dist/*
          retention-days: 30